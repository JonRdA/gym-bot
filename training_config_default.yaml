# Training config template for new users.
#
# Two sections:
#   - exercises: the catalog — each exercise defined ONCE with its metrics
#   - workouts:  named lists of exercise references (ordered)
#
# To track rest time for an exercise, set `track_rest: true`. You will be
# prompted once at the start of the exercise during /add for the rest value
# (seconds between sets). Remove/comment the flag to stop tracking.

exercises:
  # --- upper ---
  # pullup:       { metrics: [reps, weight], track_rest: true }
  pullup: { metrics: [reps], track_rest: true }
  biceps_curl_db: { metrics: [reps, weight] }

  dip: { metrics: [reps], track_rest: true }
  ring_pushup: { metrics: [reps] }
  military_press_db: { metrics: [reps, weight] }

  # --- lower ---
  backsquat: { metrics: [reps, weight], track_rest: true}
  deadlift: { metrics: [reps, weight], track_rest: true}
  jefferson_curl: { metrics: [reps, weight] }

  # --- handstand ---
  chest2wall: { metrics: [time] }
  crowpose: { metrics: [time] }
  headstance: { metrics: [time] }

  # --- pancake ---
  straddle_jefferson_curl: { metrics: [reps, weight] }

  # --- home ---
  # rice_bucket:    { metrics: [time] }
  squat2sissy:    { metrics: [reps, feet2floor] }
  heel_elevation: { metrics: [reps] }

  # --- cardio ---
  run:          { metrics: [time_min, distance] }

workouts:
  upper:      [pullup, dip, ring_pushup, biceps_curl_db, military_press_db]
  lower:     [backsquat, deadlift, jefferson_curl]
  handstand: [chest2wall, crowpose, headstance]
  pancake:   [straddle_jefferson_curl]
  home:      [squat2sissy, heel_elevation]
  run:       [run]
